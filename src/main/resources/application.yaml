spring:
  application:
    name: identity-service

  # PostgreSQL. Values are driven by env vars with local-dev defaults so the same
  # build runs locally (docker-compose) and on AWS (RDS) by only changing env.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/identity_db}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:theatre}
    password: ${DB_PASSWORD:theatre}

  jpa:
    hibernate:
      # 'update' keeps the schema in sync with entities without dropping data.
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081

# JWT configuration
jwt:
  secret: DbPgxPEztADVNGoeXqh2WnPT1iPrTVcGJHc6qJOqG95
  expiration-ms: 3600000 # 1 hour

# Auth / account lockout configuration
auth:
  max-failed-attempts: 5
  lockout-duration-minutes: 15

management:
  endpoints:
    web:
      exposure:
        include: health,info

# OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
