spring:
  application:
    name: identity-service

  # H2 in-memory DB for local development.
  datasource:
    url: jdbc:h2:mem:identitydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

server:
  port: 8081

# JWT configuration
jwt:
  secret: DbPgxPEztADVNGoeXqh2WnPT1iPrTVcGJHc6qJOqG95
  expiration-ms: 3600000 # 1 hour

# Auth / account lockout configuration
auth:
  max-failed-attempts: 5
  lockout-duration-minutes: 15

management:
  endpoints:
    web:
      exposure:
        include: health,info
